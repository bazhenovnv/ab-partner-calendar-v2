name: ab-afisha

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ab_afisha
      POSTGRES_USER: ab_afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ab_afisha -d ab_afisha"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ab-afisha/backend:backend-release-213e507}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://ab_afisha:${POSTGRES_PASSWORD}@postgres:5432/ab_afisha
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      NEXT_PUBLIC_SITE_URL: https://ab-event.pro
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_IP_FAMILY: ${TELEGRAM_IP_FAMILY:-6}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_EDITORIAL_CHANNEL_1_ID: ${MAX_EDITORIAL_CHANNEL_1_ID:-}
      MAX_EDITORIAL_CHANNEL_2_ID: ${MAX_EDITORIAL_CHANNEL_2_ID:-}
      MAX_EDITORIAL_CHANNEL_3_ID: ${MAX_EDITORIAL_CHANNEL_3_ID:-}
      MAX_IMPORT_ENABLED: ${MAX_IMPORT_ENABLED:-false}
      MAX_IMPORT_TIMEOUT_MS: ${MAX_IMPORT_TIMEOUT_MS:-60000}
      MAX_SOURCE_CHANNEL_ID: ${MAX_SOURCE_CHANNEL_ID}
      MAX_SOURCE_CHANNEL_URL: ${MAX_SOURCE_CHANNEL_URL}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET}
      MAX_WEBHOOK_PUBLIC_URL: ${MAX_WEBHOOK_PUBLIC_URL}
      ADMIN_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_CHAT_ID}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-ab-event.pro}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-15000}
      ATTENTION_EMAIL_TO: ${ATTENTION_EMAIL_TO:-info-event@a-b.ru}
      THROTTLE_LIMIT: "200"
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/apps/backend/uploads
    networks:
      - default
      - telegram-egress
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3001/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-ab-afisha/frontend:frontend-release-f168c80}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: https://ab-event.pro
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-110270689}
      NEXT_PUBLIC_CONTACT_EMAIL: info-event@a-b.ru
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  bots:
    image: ${BOTS_IMAGE:-ab-afisha/bots:bots-release-3a64511}
    restart: always
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      BACKEND_URL: http://backend:3001
      DATABASE_URL: postgresql://ab_afisha:${POSTGRES_PASSWORD}@postgres:5432/ab_afisha
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ADMIN_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_CHAT_ID}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - telegram-egress

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d/production.v2.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - uploads:/app/uploads:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

networks:
  telegram-egress:
    name: ab-afisha_telegram-egress
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.gateway_mode_ipv6: nat
      com.docker.network.host_ipv6: ${DOCKER_HOST_IPV6:-2a03:6f00:a::2:c3fd}

volumes:
  postgres-data:
    name: ab-afisha_postgres-data
  redis-data:
    name: ab-afisha_redis-data
  uploads:
    name: ab-afisha_uploads